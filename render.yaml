services:
  # Single service for both backend API and frontend
  - type: web
    name: marine-microplastics-app
    env: python3
    plan: starter
    buildCommand: |
      # Build the frontend first
      cd frontend
      npm install
      npm run build
      cd ..
      # Install Python dependencies
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
